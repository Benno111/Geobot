name: Build Geode Mod

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows32
          os: windows-latest
          build-type: Release
          target: Win32

        - name: Android32
          os: ubuntu-latest
          target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Bundle FFmpeg
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.config.target || 'Win32' }}
          FFMPEG_ANDROID32_URL: ${{ vars.FFMPEG_ANDROID32_URL }}
        run: |
          ./scripts/fetch_ffmpeg.ps1 -Target "$env:BUILD_TARGET"

      - name: Install Geode CLI
        run: |
          GEODE_CLI_VERSION=latest
          if [ "${{ matrix.config.os }}" = "windows-latest" ]; then
            GH_API_URL="https://api.github.com/repos/geode-sdk/cli/releases/${GEODE_CLI_VERSION}"
            CLI_URL=$(curl -s $GH_API_URL | grep browser_download_url | grep windows-x86_64.zip | cut -d '"' -f 4)
            curl -L -o geode-cli.zip "$CLI_URL"
            unzip geode-cli.zip -d geode-cli
            echo "$(pwd)/geode-cli" >> $GITHUB_PATH
          else
            GH_API_URL="https://api.github.com/repos/geode-sdk/cli/releases/${GEODE_CLI_VERSION}"
            CLI_URL=$(curl -s $GH_API_URL | grep browser_download_url | grep linux-x86_64.tar.gz | cut -d '"' -f 4)
            curl -L -o geode-cli.tar.gz "$CLI_URL"
            tar -xzf geode-cli.tar.gz -C geode-cli
            echo "$(pwd)/geode-cli" >> $GITHUB_PATH
          fi
        shell: bash
      - name: Install Geode SDK binaries
        run: |
          if [ "${{ matrix.config.target }}" = "Win32" ]; then
            geode sdk install-binaries --platform windows
          elif [ "${{ matrix.config.target }}" = "Android32" ]; then
            geode sdk install-binaries --platform android
          else
            geode sdk install-binaries --platform ${{ matrix.config.target }}
          fi
        shell: bash
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          build-config: ${{ matrix.config.build-type || 'Release' }}
          export-pdb: false
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}
          platform: ${{ matrix.config.target == 'Win32' && 'windows' || matrix.config.target == 'Android32' && 'android' || matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Create draft release and upload package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: |
            ${{ steps.build.outputs.build-output }}
            ${{ steps.build.outputs.build-output }}/*
