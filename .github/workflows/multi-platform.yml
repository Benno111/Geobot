name: Build Geode Mod

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          build-type: Release

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

        - name: iOS
          os: macos-latest
          target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Bundle FFmpeg
        if: ${{ matrix.config.target != 'iOS' }}
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.config.target || 'Windows' }}
          FFMPEG_ANDROID32_URL: ${{ vars.FFMPEG_ANDROID32_URL }}
          FFMPEG_ANDROID64_URL: ${{ vars.FFMPEG_ANDROID64_URL }}
        run: |
          ./scripts/fetch_ffmpeg.ps1 -Target "$env:BUILD_TARGET"

      - name: Restore build object cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build*
          key: geobot-objects-${{ runner.os }}-${{ matrix.config.target || 'Windows' }}-${{ matrix.config.build-type || 'Release' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geobot-objects-${{ runner.os }}-${{ matrix.config.target || 'Windows' }}-${{ matrix.config.build-type || 'Release' }}-

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          build-config: ${{ matrix.config.build-type || 'Release' }}
          export-pdb: false
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

      - name: Save build object cache
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build*
          key: geobot-objects-${{ runner.os }}-${{ matrix.config.target || 'Windows' }}-${{ matrix.config.build-type || 'Release' }}-${{ github.run_id }}-${{ github.run_attempt }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Create draft release and upload package
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: |
            ${{ steps.build.outputs.build-output }}
            ${{ steps.build.outputs.build-output }}/*
